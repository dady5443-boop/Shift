<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Shift v3.0</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root {
    --accent: #00ff88;
    --accent-dim: rgba(0,255,136,0.15);
    --accent-glow: rgba(0,255,136,0.4);
    --bg: #000000;
    --panel: #1e1f22;
    --panel2: #2b2d31;
    --text: #ffffff;
    --text-muted: #8b8d93;
    --danger: #ff4455;
    --glovo: #ff6b00;
    --bolt: #34d058;
    --glass: rgba(30,31,34,0.7);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* AMOLED animated bg */
  .bg-anim {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  }
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.07;
    animation: blobMove 18s infinite alternate ease-in-out;
  }
  .bg-blob:nth-child(1) { width:400px; height:400px; background:var(--accent); top:-100px; left:-100px; animation-duration:20s; }
  .bg-blob:nth-child(2) { width:300px; height:300px; background:#00bbff; bottom:-80px; right:-80px; animation-duration:25s; animation-delay:-8s; }
  .bg-blob:nth-child(3) { width:250px; height:250px; background:var(--accent); top:40%; left:30%; animation-duration:22s; animation-delay:-4s; }

  @keyframes blobMove {
    0% { transform: translate(0,0) scale(1); }
    33% { transform: translate(40px,-30px) scale(1.1); }
    66% { transform: translate(-20px,50px) scale(0.95); }
    100% { transform: translate(30px,20px) scale(1.05); }
  }

  /* SIDEBAR (для ПК) */
  .sidebar {
    width: 64px;
    min-width: 64px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    gap: 8px;
    z-index: 10;
    border-right: 1px solid rgba(255,255,255,0.05);
    position: fixed;
    top: 0; bottom: 0; left: 0;
  }

  /* MOBILE NAVIGATION (для телефонов) */
  .mobile-nav {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    background: var(--panel);
    border-top: 1px solid rgba(255,255,255,0.05);
    z-index: 100;
    justify-content: space-around;
    align-items: center;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .sidebar-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 12px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    opacity: 0.7;
  }

  .nav-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
  }
  .sidebar .nav-btn::before {
    content:'';
    position: absolute;
    left: -16px;
    width: 4px; height: 0;
    background: var(--accent);
    border-radius: 0 3px 3px 0;
    transition: height 0.2s;
  }
  .nav-btn.active {
    border-radius: 30%;
    background: var(--accent-dim);
    color: var(--accent);
  }
  .sidebar .nav-btn.active::before { height: 24px; }
  .nav-btn:not(.active):hover {
    border-radius: 35%;
    background: rgba(255,255,255,0.07);
    color: var(--text);
  }

  /* MAIN */
  .main {
    flex: 1;
    margin-left: 64px;
    position: relative;
    z-index: 1;
  }

  /* TABS */
  .tab { display: none; padding: 16px 14px 40px; }
  .tab.active { display: block; }

  /* GLASS CARD */
  .card {
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
  }

  /* HEADER BALANCE CARD */
  .balance-card {
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .balance-top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }

  .period-tabs {
    display: flex; gap: 6px;
  }
  .period-btn {
    padding: 6px 12px; border-radius: 20px; border: none;
    background: rgba(255,255,255,0.07); color: var(--text-muted);
    font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .period-btn.active {
    background: var(--accent-dim); color: var(--accent);
  }

  .incognito-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.07); color: var(--text-muted);
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .incognito-btn.active { background: var(--accent-dim); color: var(--accent); }

  .balance-main { margin-bottom: 6px; }
  .balance-label { font-size: 12px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .balance-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 40px; font-weight: 700; color: var(--accent);
    line-height: 1.1;
    text-shadow: 0 0 30px var(--accent-glow);
    transition: all 0.3s;
  }
  .balance-value.hidden-val { letter-spacing: 0.1em; opacity: 0.5; }
  
  /* SUMMARY ROWS */
  .summary-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px;
  }
  .summary-item {
    display: flex; flex-direction: column;
    background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 13px;
  }
  .summary-item.full-width { grid-column: span 2; }
  .summary-item-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .summary-item-value {
    font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700;
  }
  .summary-item-value.gross-color { color: #d4d4d4; }
  .summary-item-value.net-color { color: var(--accent); }
  .summary-item-value.tax-color { color: var(--danger); }

  /* TAX BREAKDOWN ROW */
  .tax-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.06); }
  .tax-item {
    display: flex; flex-direction: column;
    background: rgba(255,68,85,0.07); border-radius: 10px; padding: 7px 10px;
    flex: 1; min-width: 80px;
  }
  .tax-item-label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .tax-item-value { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--danger); }

  /* WIDGETS ROW */
  .widgets-row { display: flex; gap: 12px; margin-bottom: 14px; }
  .widget { flex: 1; }

  /* GOAL WIDGET */
  .goal-widget {
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    padding: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 140px;
  }
  .goal-label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .goal-ring-wrap { position: relative; width: 88px; height: 88px; }
  .goal-ring-wrap svg { width: 88px; height: 88px; transform: rotate(-90deg); }
  .goal-ring-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 7; }
  .goal-ring-fill { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1); filter: drop-shadow(0 0 6px var(--accent-glow)); }
  .goal-pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: var(--accent);
  }

  /* PIE WIDGET */
  .pie-widget {
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    padding: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 140px;
  }
  .pie-label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .pie-canvas-wrap { position: relative; width: 88px; height: 88px; }
  .pie-legend { display: flex; gap: 10px; margin-top: 8px; }
  .pie-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .pie-legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* FORM */
  .form-card .form-title { font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
  .brand-picker { display: flex; gap: 8px; margin-bottom: 12px; }
  .brand-btn {
    flex: 1; padding: 12px; border-radius: 14px; border: 2px solid transparent;
    background: rgba(255,255,255,0.05); font-family: 'Manrope',sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .brand-btn.glovo.active { border-color: var(--glovo); background: rgba(255,107,0,0.12); color: var(--glovo); }
  .brand-btn.bolt.active { border-color: var(--bolt); background: rgba(52,208,88,0.12); color: var(--bolt); }
  .brand-btn:not(.active) { color: var(--text-muted); }

  .inputs-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .input-group label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 5px; }
  .inp {
    width: 100%; padding: 12px; border-radius: 12px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600;
    outline: none; transition: border-color 0.2s;
  }
  .inp:focus { border-color: var(--accent); background: rgba(0,255,136,0.05); }
  .inp::placeholder { color: rgba(255,255,255,0.2); }

  .add-btn {
    width: 100%; padding: 15px; border-radius: 14px; border: none;
    background: var(--accent); color: #000; font-family: 'Manrope',sans-serif;
    font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .add-btn:active { transform: scale(0.97); opacity: 0.9; }

  /* HISTORY */
  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .shift-bubble {
    background: var(--panel2);
    border-radius: 18px 18px 4px 18px;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.06);
    animation: bubbleIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    display: flex; align-items: flex-start; gap: 10px;
  }
  @keyframes bubbleIn {
    from { opacity:0; transform: scale(0.85) translateX(20px); }
    to { opacity:1; transform: scale(1) translateX(0); }
  }
  .bubble-brand-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px;
  }
  .bubble-content { flex: 1; }
  .bubble-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bubble-brand { font-size: 13px; font-weight: 700; }
  .bubble-time { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .bubble-nums { display: flex; gap: 10px; flex-wrap: wrap; }
  .bubble-num { display: flex; flex-direction: column; }
  .bubble-num-label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
  .bubble-num-val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
  .bubble-net { color: var(--accent); }
  .delete-btn {
    width: 38px; height: 38px; border-radius: 12px; border: none;
    background: rgba(255,68,85,0.1); color: var(--danger);
    font-size: 17px; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .delete-btn:active { background: rgba(255,68,85,0.3); transform: scale(0.92); }

  /* TEMPLATES */
  .templates-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .template-card {
    background: var(--panel2); border-radius: 16px; padding: 14px;
    border: 1px solid rgba(255,255,255,0.07);
    cursor: pointer; transition: all 0.2s; position: relative;
  }
  .template-card:active { transform: scale(0.95); }
  .template-card.glovo-t { border-top: 3px solid var(--glovo); }
  .template-card.bolt-t { border-top: 3px solid var(--bolt); }
  .template-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .template-meta { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .template-del {
    position: absolute; top: 8px; right: 8px;
    width: 24px; height: 24px; border-radius: 8px; border: none;
    background: rgba(255,68,85,0.1); color: var(--danger); font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }

  /* EFFICIENCY */
  .eff-row { display: flex; gap: 10px; }
  .eff-stat {
    flex: 1; background: rgba(255,255,255,0.04); border-radius: 14px; padding: 14px;
    text-align: center;
  }
  .eff-stat-val { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--accent); }
  .eff-stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }

  /* CHART */
  .chart-scroll { overflow-x: auto; padding-bottom: 8px; }
  .chart-scroll::-webkit-scrollbar { height: 3px; }
  .chart-scroll::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }
  .candles-wrap { display: flex; align-items: flex-end; gap: 6px; padding: 12px 4px; min-width: max-content; }
  .candle-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 32px; }
  .candle-date { font-size: 9px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; text-align: center; }

  /* SETTINGS */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 15px; font-weight: 600; }
  .setting-sublabel { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .accent-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .accent-dot {
    width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent;
    cursor: pointer; transition: all 0.2s;
  }
  .accent-dot.active { border-color: white; transform: scale(1.15); }

  .action-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    margin-bottom: 10px;
  }
  .action-btn.export { background: rgba(0,255,136,0.1); color: var(--accent); border: 1px solid rgba(0,255,136,0.2); }
  .action-btn.danger-btn { background: rgba(255,68,85,0.1); color: var(--danger); border: 1px solid rgba(255,68,85,0.2); }
  .action-btn:active { transform: scale(0.97); }

  .version-text { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(255,255,255,0.15); margin-top: 20px; }
  .section-title { font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel2); border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: all 0.3s; z-index: 100; white-space: nowrap;
    backdrop-filter: blur(20px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 150;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--panel); border-radius: 22px; padding: 24px;
    width: 100%; max-width: 320px; border: 1px solid rgba(255,255,255,0.1);
    transform: scale(0.9); transition: transform 0.2s;
